
name: CI/CD API Sensor Suhu Kelompok 2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Mengambil source code dari GitHub
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Menyiapkan Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Login ke Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Build dan Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            rufinuslalau/iot-api-sensor:latest
            rufinuslalau/iot-api-sensor:${{ github.sha }}
